[package]
name = "porter-ui"
version = "0.1.0"
edition = "2021"
description = "Porter native settings UI (GPUI): General / Connectors / Agents over the porter daemon"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
arboard = "3"
