[package]
name = "porter"
version = "0.1.0"
edition = "2021"
description = "Local API holder + Jev-gated router for agents (codex/hermes/omp) and providers (LLMs, notion, etc.)"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
